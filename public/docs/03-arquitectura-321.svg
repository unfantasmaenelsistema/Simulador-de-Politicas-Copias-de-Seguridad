<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", "Segoe UI", Roboto, sans-serif; }
      .font-mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="600" fill="#f8fafc" rx="12" />

  <!-- Top Section: 4 Pillars of 3-2-1-1-0 -->
  <rect x="28" y="24" width="1144" height="176" rx="12" fill="#ffffff" stroke="#e2e8f0" />
  <text x="48" y="54" class="font-sans" font-size="15" font-weight="700" fill="#0f172a">01. Laboratorio de Estrategia 3-2-1 y Extensión 3-2-1-1-0</text>

  <!-- Pillar 3 -->
  <rect x="48" y="74" width="260" height="106" rx="10" fill="#ecfdf5" stroke="#10b981" />
  <text x="64" y="110" class="font-mono" font-size="28" font-weight="700" fill="#0f172a">3</text>
  <text x="175" y="104" class="font-mono" font-size="11" font-weight="700" fill="#059669">✓ CUMPLIDO (3/3)</text>
  <text x="64" y="138" class="font-sans" font-size="13" font-weight="700" fill="#0f172a">Al menos 3 Copias de Datos</text>
  <text x="64" y="158" class="font-sans" font-size="11" fill="#475569">1 Producción + 2 Respaldos</text>

  <!-- Pillar 2 -->
  <rect x="326" y="74" width="260" height="106" rx="10" fill="#ecfdf5" stroke="#10b981" />
  <text x="342" y="110" class="font-mono" font-size="28" font-weight="700" fill="#0f172a">2</text>
  <text x="445" y="104" class="font-mono" font-size="11" font-weight="700" fill="#059669">✓ CUMPLIDO (3 tipos)</text>
  <text x="342" y="138" class="font-sans" font-size="13" font-weight="700" fill="#0f172a">En 2 Soportes Distintos</text>
  <text x="342" y="158" class="font-sans" font-size="11" fill="#475569">RAID NVMe + NAS + Cloud S3</text>

  <!-- Pillar 1 -->
  <rect x="604" y="74" width="260" height="106" rx="10" fill="#ecfdf5" stroke="#10b981" />
  <text x="620" y="110" class="font-mono" font-size="28" font-weight="700" fill="#0f172a">1</text>
  <text x="720" y="104" class="font-mono" font-size="11" font-weight="700" fill="#059669">✓ CUMPLIDO (1 externa)</text>
  <text x="620" y="138" class="font-sans" font-size="13" font-weight="700" fill="#0f172a">1 Copia Fuera del Sitio (Offsite)</text>
  <text x="620" y="158" class="font-sans" font-size="11" fill="#475569">Protegida en otra región geográfica</text>

  <!-- Pillar +1-0 -->
  <rect x="882" y="74" width="268" height="106" rx="10" fill="#f0f9ff" stroke="#0284c7" />
  <text x="898" y="110" class="font-mono" font-size="26" font-weight="700" fill="#0f172a">+1-0</text>
  <text x="1015" y="104" class="font-mono" font-size="11" font-weight="700" fill="#0284c7">✓ INMUTABLE (1)</text>
  <text x="898" y="138" class="font-sans" font-size="13" font-weight="700" fill="#0f172a">1 Copia Inmutable WORM / Air-Gap</text>
  <text x="898" y="158" class="font-sans" font-size="11" fill="#475569">Blindaje contra cifrado Ransomware</text>

  <!-- Bottom Left: Infrastructure Nodes -->
  <rect x="28" y="218" width="660" height="356" rx="12" fill="#ffffff" stroke="#e2e8f0" />
  <text x="48" y="248" class="font-sans" font-size="14" font-weight="700" fill="#0f172a">02. Nodos de Datos y Repositorios de tu Infraestructura</text>

  <!-- Node 1 -->
  <rect x="48" y="266" width="620" height="86" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="64" y="290" class="font-sans" font-size="13" font-weight="700" fill="#0f172a">☑ Copia 1: Servidor de Producción (Datos Activos)</text>
  <text x="64" y="316" class="font-sans" font-size="11" fill="#475569">Soporte: Cabina RAID NVMe / SSD Internos</text>
  <text x="360" y="316" class="font-sans" font-size="11" fill="#475569">Ubicación: Sala de Servidores / CPD Principal</text>

  <!-- Node 2 -->
  <rect x="48" y="364" width="620" height="86" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="64" y="388" class="font-sans" font-size="13" font-weight="700" fill="#0f172a">☑ Copia 2: Repositorio Primario de Respaldo</text>
  <text x="64" y="414" class="font-sans" font-size="11" fill="#475569">Soporte: NAS en Red Local (SMB / NFS)</text>
  <text x="360" y="414" class="font-sans" font-size="11" fill="#475569">Ubicación: Sala de Servidores / CPD Principal</text>

  <!-- Node 3 -->
  <rect x="48" y="462" width="620" height="86" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="64" y="486" class="font-sans" font-size="13" font-weight="700" fill="#0f172a">☑ Copia 3: Repositorio Secundario / Externo</text>
  <rect x="478" y="470" width="174" height="24" rx="4" fill="#059669" />
  <text x="492" y="486" class="font-sans" font-size="11" font-weight="600" fill="#ffffff">🔒 Inmutable WORM / Air-Gap</text>
  <text x="64" y="512" class="font-sans" font-size="11" fill="#475569">Soporte: Cloud Object Storage (S3)</text>
  <text x="360" y="512" class="font-sans" font-size="11" fill="#475569">Ubicación: Nube Pública (Offsite)</text>

  <!-- Bottom Right: 3 Catastrophe Audits -->
  <rect x="704" y="218" width="468" height="356" rx="12" fill="#ffffff" stroke="#e2e8f0" />
  <text x="724" y="248" class="font-sans" font-size="14" font-weight="700" fill="#0f172a">03. Auditoría de Supervivencia ante 3 Catástrofes</text>

  <!-- Catastrophe A -->
  <rect x="724" y="266" width="428" height="86" rx="8" fill="#ecfdf5" stroke="#a7f3d0" />
  <text x="740" y="290" class="font-sans" font-size="12" font-weight="700" fill="#065f46">Escenario A: Rotura de RAID en Servidor · ✓ SOBREVIVE</text>
  <text x="740" y="314" class="font-sans" font-size="11" fill="#047857">Superado: Dispones de 2 copias independientes adicionales</text>
  <text x="740" y="332" class="font-sans" font-size="11" fill="#047857">para restaurar el servicio de inmediato.</text>

  <!-- Catastrophe B -->
  <rect x="724" y="364" width="428" height="86" rx="8" fill="#ecfdf5" stroke="#a7f3d0" />
  <text x="740" y="388" class="font-sans" font-size="12" font-weight="700" fill="#065f46">Escenario B: Ataque de Ransomware en Red · ✓ SOBREVIVE</text>
  <text x="740" y="412" class="font-sans" font-size="11" fill="#047857">Superado: El malware cifra el NAS local por SMB, pero la Copia 3</text>
  <text x="740" y="430" class="font-sans" font-size="11" fill="#047857">resiste intacta gracias al bloqueo Inmutable WORM / Air-Gap.</text>

  <!-- Catastrophe C -->
  <rect x="724" y="462" width="428" height="86" rx="8" fill="#ecfdf5" stroke="#a7f3d0" />
  <text x="740" y="486" class="font-sans" font-size="12" font-weight="700" fill="#065f46">Escenario C: Incendio / Inundación en CPD · ✓ SOBREVIVE</text>
  <text x="740" y="510" class="font-sans" font-size="11" fill="#047857">Superado: El siniestro destruye el edificio principal, pero los</text>
  <text x="740" y="528" class="font-sans" font-size="11" fill="#047857">datos se recuperan desde la ubicación remota Offsite.</text>
</svg>
