<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="100%" height="100%">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", "Segoe UI", Roboto, sans-serif; }
      .font-mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="580" fill="#f8fafc" rx="12" />

  <!-- Top: 3 Live Engineering Challenges -->
  <text x="28" y="38" class="font-sans" font-size="15" font-weight="700" fill="#0f172a">01. Retos de Configuración en Vivo (Evaluados sobre tu Planificador Actual)</text>

  <!-- Challenge 1 -->
  <rect x="28" y="54" width="368" height="210" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="1.5" />
  <text x="48" y="80" class="font-mono" font-size="11" font-weight="700" fill="#0284c7">RETO 01</text>
  <text x="300" y="80" class="font-mono" font-size="11" font-weight="700" fill="#059669">✓ SUPERADO</text>
  <text x="48" y="106" class="font-sans" font-size="13" font-weight="700" fill="#0f172a">Cuota Estricta en NAS PyME (≤ 780 GB)</text>
  <text x="48" y="128" class="font-sans" font-size="11" fill="#475569">• Copia Completa base el Lunes</text>
  <text x="48" y="146" class="font-sans" font-size="11" fill="#475569">• 0 días sin respaldo programado</text>
  <text x="48" y="164" class="font-sans" font-size="11" fill="#475569">• Espacio semanal: 765 GB ≤ 780 GB</text>
  <rect x="48" y="218" width="328" height="30" rx="6" fill="#0f172a" />
  <text x="112" y="237" class="font-sans" font-size="11" font-weight="600" fill="#ffffff">▶ Cargar Datos del Reto en Simulador</text>

  <!-- Challenge 2 -->
  <rect x="416" y="54" width="368" height="210" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="1.5" />
  <text x="436" y="80" class="font-mono" font-size="11" font-weight="700" fill="#0284c7">RETO 02</text>
  <text x="688" y="80" class="font-mono" font-size="11" font-weight="700" fill="#059669">✓ SUPERADO</text>
  <text x="436" y="106" class="font-sans" font-size="13" font-weight="700" fill="#0f172a">Restauración Rápida en Viernes (≤ 2 Pasos)</text>
  <text x="436" y="128" class="font-sans" font-size="11" fill="#475569">• Copia Completa obligatoria el Lunes</text>
  <text x="436" y="146" class="font-sans" font-size="11" fill="#475569">• Restaurar Viernes en máximo 2 soportes</text>
  <text x="436" y="164" class="font-sans" font-size="11" fill="#475569">• Consumo semanal controlado ≤ 1.150 GB</text>
  <rect x="436" y="218" width="328" height="30" rx="6" fill="#0f172a" />
  <text x="500" y="237" class="font-sans" font-size="11" font-weight="600" fill="#ffffff">▶ Cargar Datos del Reto en Simulador</text>

  <!-- Challenge 3 -->
  <rect x="804" y="54" width="368" height="210" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="1.5" />
  <text x="824" y="80" class="font-mono" font-size="11" font-weight="700" fill="#0284c7">RETO 03</text>
  <text x="1076" y="80" class="font-mono" font-size="11" font-weight="700" fill="#059669">✓ SUPERADO</text>
  <text x="824" y="106" class="font-sans" font-size="13" font-weight="700" fill="#0f172a">Blindaje 3-2-1-1-0 y RTO ≤ 45 min</text>
  <text x="824" y="128" class="font-sans" font-size="11" fill="#475569">• Arquitectura 3-2-1-1-0 con Inmutabilidad</text>
  <text x="824" y="146" class="font-sans" font-size="11" fill="#475569">• Soporte LTO-8 / 10GbE con RTO ≤ 45 min</text>
  <text x="824" y="164" class="font-sans" font-size="11" fill="#475569">• Sin días laborables descubiertos</text>
  <rect x="824" y="218" width="328" height="30" rx="6" fill="#0f172a" />
  <text x="888" y="237" class="font-sans" font-size="11" font-weight="600" fill="#ffffff">▶ Cargar Datos del Reto en Simulador</text>

  <!-- Bottom: Interactive Exam Case Study -->
  <rect x="28" y="284" width="1144" height="270" rx="12" fill="#ffffff" stroke="#e2e8f0" />
  <text x="48" y="314" class="font-sans" font-size="14" font-weight="700" fill="#0f172a">02. Supuestos Prácticos de Examen — Caso 1: Restauración en Política Mixta (Full + Diff + Inc)</text>
  <text x="48" y="336" class="font-sans" font-size="12" fill="#475569">El SÁBADO a las 11:00h (antes del backup nocturno) cae el servidor. Copias ejecutadas: Lun Full (400GB), Mar Inc (25GB), Mié Diff (60GB), Jue Inc (30GB), Vie Inc (20GB).</text>

  <!-- Option A -->
  <rect x="48" y="356" width="545" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1" />
  <text x="64" y="378" class="font-sans" font-size="12" font-weight="600" fill="#334155">1º Lunes (Full) → 2º Martes (Inc) → 3º Miércoles (Diff) → 4º Jueves (Inc) → 5º Viernes (Inc)</text>
  <text x="64" y="400" class="font-mono" font-size="11" fill="#64748b">Volumen leído: 535 GB (5 pasos)</text>

  <!-- Option B (Selected Correct) -->
  <rect x="608" y="356" width="544" height="58" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" />
  <text x="624" y="378" class="font-sans" font-size="12" font-weight="700" fill="#065f46">1º Lunes (Full) → 2º Miércoles (Diferencial) → 3º Jueves (Inc) → 4º Viernes (Inc)</text>
  <text x="624" y="400" class="font-mono" font-size="11" font-weight="700" fill="#059669">Volumen leído: 510 GB (4 pasos) · ✓ RESPUESTA CORRECTA</text>

  <!-- Explanation Box -->
  <rect x="48" y="430" width="1104" height="56" rx="8" fill="#ecfdf5" stroke="#6ee7b7" />
  <text x="68" y="454" class="font-sans" font-size="12" font-weight="600" fill="#065f46">✓ ¡Exacto! Primero se carga la Completa del Lunes (400 GB). Luego se salta el Martes y se aplica directamente la Diferencial del Miércoles (60 GB).</text>
  <text x="68" y="474" class="font-sans" font-size="12" fill="#047857">Finalmente se aplican en orden cronológico las Incrementales posteriores: Jueves (30 GB) y Viernes (20 GB). Total leído: 510 GB.</text>
</svg>
